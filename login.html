<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Portal Authentication | Sri Sathya Sai District CSR Cell</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="District Collector Login, CSR Nodal Officer Login, Corporate Sponsor Portal Login" name="description">

    <!-- Favicon -->
    <link href="img/csr_logo.png" rel="icon" type="image/png">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Stylesheets -->
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #001838, #002858 60%, #003a6b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }

        .auth-header {
            background: #001838;
            color: #FFFFFF;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #06A3DA;
        }

        .role-btn {
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: center;
        }

        .role-btn.active, .role-btn:hover {
            border-color: #06A3DA;
            background: #F0F9FF;
            color: #06A3DA;
        }
    </style>
    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

<body>
    <div class="auth-card">
        <div class="auth-header">
            <img src="img/csr_logo.png" style="height: 60px;" alt="Logo" class="mb-2">
            <h4 class="fw-bold mb-1" data-i18n="login_title">District CSR Portal Login</h4>
            <small class="text-white-50" data-i18n="login_subtitle">Select your authorization role to access workspace</small>
        </div>

        <div class="p-4 p-md-5">
            <!-- Role Selector -->
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Select Authorization Role</label>
            <div class="row g-2 mb-4">
                <div class="col-4">
                    <div class="role-btn active" id="role-btn-collector" onclick="selectRole('Collector')">
                        <i class="bi bi-person-workspace fs-4 d-block mb-1 text-primary"></i>
                        <small style="font-size: 11px;">District Collector</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="role-btn" id="role-btn-nodal" onclick="selectRole('Nodal')">
                        <i class="bi bi-shield-lock-fill fs-4 d-block mb-1 text-success"></i>
                        <small style="font-size: 11px;">Nodal Officer</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="role-btn" id="role-btn-sponsor" onclick="selectRole('Sponsor')">
                        <i class="bi bi-building fs-4 d-block mb-1 text-warning"></i>
                        <small style="font-size: 11px;">Sponsor Company</small>
                    </div>
                </div>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">User ID / Official Email</label>
                    <input type="text" id="username-input" class="form-control form-control-lg" value="collector@ap.gov.in" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" id="password-input" class="form-control form-control-lg" placeholder="Enter password" required>
                </div>

                <div class="p-3 bg-light rounded-3 mb-4 border border-dashed">
                    <small class="text-muted d-block fw-semibold mb-1"><i class="bi bi-info-circle-fill text-primary me-1"></i> Quick Role Presets for Verification:</small>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-xs btn-outline-primary py-1 px-2 text-xs" onclick="quickFill('collector@ap.gov.in', 'Collector')">Collector Sir</button>
                        <button type="button" class="btn btn-xs btn-outline-success py-1 px-2 text-xs" onclick="quickFill('nodal-csr@ap.gov.in', 'Nodal')">Nodal Officer</button>
                        <button type="button" class="btn btn-xs btn-outline-warning py-1 px-2 text-xs" onclick="quickFill('csr.kia@kiamotors.in', 'Sponsor')">KIA Motors (Sponsor)</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold py-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Enter Authorized Workspace
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="index.html" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Return to Main Portal Homepage</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        let selectedRole = "Collector";

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
            
            if (role === "Collector") {
                document.getElementById("role-btn-collector").classList.add("active");
                document.getElementById("username-input").value = "collector@ap.gov.in";
            } else if (role === "Nodal") {
                document.getElementById("role-btn-nodal").classList.add("active");
                document.getElementById("username-input").value = "nodal-csr@ap.gov.in";
            } else if (role === "Sponsor") {
                document.getElementById("role-btn-sponsor").classList.add("active");
                document.getElementById("username-input").value = "csr.kia@kiamotors.in";
            }
        }

        function quickFill(email, role) {
            selectRole(role);
            document.getElementById("username-input").value = email;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("username-input").value;

            let userObj = {
                username: username,
                role: selectedRole,
                name: selectedRole === "Collector" ? "Sri A. Shyam Prasad, I.A.S" : (selectedRole === "Nodal" ? "Sri M. Ramanaiah, Joint Collector & Nodal Officer" : "KIA Motors India CSR Desk"),
                title: selectedRole === "Collector" ? "District Collector & Magistrate" : (selectedRole === "Nodal" ? "District CSR Nodal Officer" : "Corporate CSR Partner")
            };

            localStorage.setItem("csr_current_user", JSON.stringify(userObj));
            window.location.href = "dashboard.html";
        }
    </script>
</body>

</html>
