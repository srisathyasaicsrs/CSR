<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Portal Authentication | Sri Sathya Sai District CSR Cell</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="District Collector Login, CSR Nodal Officer Login, Corporate Sponsor Portal Login"
        name="description">

    <!-- Favicon -->
    <link href="img/csr_logo.png" rel="icon" type="image/png">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Stylesheets -->
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #001838, #002858 60%, #003a6b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }

        .auth-header {
            background: #001838;
            color: #FFFFFF;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #06A3DA;
        }

        .role-btn {
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            color: #475569;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: center;
        }

        .role-btn.active,
        .role-btn:hover {
            border-color: #06A3DA;
            background: #F0F9FF;
            color: #06A3DA;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94A3B8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 8px 0 16px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #E2E8F0;
        }

        .btn-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            border: 2px solid #E2E8F0;
            background: #FFFFFF;
            color: #1E293B;
            font-weight: 700;
            border-radius: 999px;
            padding: 14px 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-google:hover,
        .btn-google:focus {
            border-color: #06A3DA;
            box-shadow: 0 8px 20px rgba(6, 163, 218, 0.12);
            color: #001838;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="auth-header">
            <img src="img/csr_logo.png" style="height: 60px;" alt="Logo" class="mb-2">
            <h4 class="fw-bold mb-1" style="color: #06A3DA;" data-i18n="login_title">District CSR Portal Login</h4>
        </div>

        <div class="p-4 p-md-5">
            <!-- Role Selector -->
            <label class="form-label small fw-bold text-muted text-uppercase mb-2">Select Authorization Role</label>
            <div class="row g-2 mb-4">
                <div class="col-4">
                    <div class="role-btn active" id="role-btn-collector" onclick="selectRole('Collector')">
                        <i class="bi bi-person-workspace fs-4 d-block mb-1 text-primary"></i>
                        <small style="font-size: 11px;">District Collector</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="role-btn" id="role-btn-nodal" onclick="selectRole('Nodal')">
                        <i class="bi bi-shield-lock-fill fs-4 d-block mb-1 text-success"></i>
                        <small style="font-size: 11px;">Nodal Officer</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="role-btn" id="role-btn-sponsor" onclick="selectRole('Sponsor')">
                        <i class="bi bi-building fs-4 d-block mb-1 text-warning"></i>
                        <small style="font-size: 11px;">Sponsor Company</small>
                    </div>
                </div>
            </div>

            <!-- Staff email login -->
            <form id="staff-login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Official Email</label>
                    <input type="email" id="username-input" class="form-control form-control-lg"
                        placeholder="name@ap.gov.in" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" id="password-input" class="form-control form-control-lg"
                        placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold py-3 btn-portal">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Enter Authorized Workspace
                </button>
            </form>

            <!-- Sponsor company signup / login (Cloudflare Auth) -->
            <div id="sponsor-login-panel" hidden>
                <p class="small text-muted mb-3">Sponsor companies create an account on this portal. Use the company email and a password of at least 8 characters.</p>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Company / Foundation Name</label>
                    <input type="text" id="sponsor-company-input" class="form-control form-control-lg" placeholder="Company name" autocomplete="organization">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Official Email</label>
                    <input type="email" id="sponsor-email-input" class="form-control form-control-lg" placeholder="csr@company.com" autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" id="sponsor-password-input" class="form-control form-control-lg" placeholder="At least 8 characters" autocomplete="current-password">
                </div>
                <button type="button" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold py-3 mb-2" onclick="handleSponsorLogin()">
                    Sign in as Sponsor
                </button>
                <button type="button" class="btn btn-outline-primary btn-lg w-100 rounded-pill fw-bold py-3" onclick="handleSponsorSignup()">
                    Create sponsor account
                </button>
            </div>
            <p id="login-status" class="small mt-3 mb-0 eoi-form-status" role="status" aria-live="polite"></p>

            <div class="text-center mt-4 d-flex justify-content-center gap-3">
                <a href="index.html" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Return to Main Portal Homepage</a>
                <span class="text-muted">•</span>
                <a href="privacy-policy.html" target="_blank" class="text-decoration-none small text-warning fw-semibold"><i class="bi bi-shield-lock me-1"></i> Privacy Policy</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/csr-client.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
